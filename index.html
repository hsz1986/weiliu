<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>微流解析 — 已迁移至新站点</title>
<meta http-equiv="refresh" content="3;url=https://allen857king.cn/">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;width:100%}
  body{
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Segoe UI", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    min-height:100vh;
    padding:40px 20px;
  }
  .container{max-width:640px;width:100%}
  .icon{font-size:72px;margin-bottom:24px;display:block}
  h1{
    font-size:48px;font-weight:800;
    letter-spacing:-0.5px;
    margin-bottom:16px;
    line-height:1.2;
  }
  h1 .highlight{
    background:linear-gradient(135deg,#0071e3,#5856d6);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    background-clip:text;
  }
  .sub{
    font-size:20px;color:rgba(255,255,255,0.65);
    margin-bottom:12px;line-height:1.6;
  }
  .new-addr{
    display:inline-block;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.15);
    padding:16px 32px;border-radius:16px;
    font-size:22px;font-weight:700;
    color:#fff;
    margin:20px 0 32px;
    transition:all .3s;
    text-decoration:none;
  }
  .new-addr:hover{
    background:rgba(255,255,255,0.18);
    transform:scale(1.04);
    box-shadow:0 8px 32px rgba(0,113,227,0.3);
  }
  .countdown{
    font-size:15px;color:rgba(255,255,255,0.45);
    margin-bottom:40px;
  }
  .countdown span{color:#0071e3;font-weight:700;font-size:18px}
  .btn{
    display:inline-block;
    background:#0071e3;color:#fff;
    padding:16px 48px;border-radius:32px;
    font-size:18px;font-weight:700;
    text-decoration:none;
    transition:all .3s;
  }
  .btn:hover{
    background:#0077ed;
    transform:scale(1.05);
    box-shadow:0 8px 32px rgba(0,113,227,0.4);
  }
  .old-notice{
    margin-top:40px;
    font-size:13px;color:rgba(255,255,255,0.3);
  }
</style>
</head>
<body>
<div class="container">
  <span class="icon">🚀</span>
  <h1>本站已<span class="highlight">迁移</span></h1>
  <p class="sub">此页面为临时展示站点，已不再使用</p>
  <p class="sub">所有功能已迁移至全新官方站点</p>
  <a class="new-addr" href="https://allen857king.cn/">allen857king.cn</a>
  <div class="countdown"><span id="num">3</span> 秒后自动跳转至新站点</div>
  <a class="btn" href="https://allen857king.cn/">👆 立即前往新站点</a>
  <div class="old-notice">微流解析 · 2026</div>
</div>

<script>
(function(){
  var numEl=document.getElementById('num');
  var count=3;
  var timer=setInterval(function(){
    count--;
    if(count<=0){clearInterval(timer);window.location.href='https://allen857king.cn/';return}
    numEl.textContent=count;
  },1000);
})();
</script>
</body>
</html>
